<svg viewBox="0 0 640 880" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e5e5" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="880" fill="#fafafa"/>
  <rect width="640" height="880" fill="url(#grid)"/>

  <!-- Title -->
  <text x="40" y="35" font-family="monospace" font-size="14" fill="#333" font-weight="bold">SK Install Flow</text>
  <text x="200" y="35" font-family="monospace" font-size="12" fill="#888">[ FLOW ]</text>

  <!-- Vertical guide -->
  <line x1="310" y1="55" x2="310" y2="795" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ═══ Start ═══ -->
  <ellipse cx="310" cy="80" rx="120" ry="22" fill="#fff" stroke="#3498db" stroke-width="2"/>
  <text x="310" y="85" font-family="monospace" font-size="10" fill="#3498db" text-anchor="middle">npx shipkit-cld [target]</text>

  <!-- Arrow down -->
  <path d="M 310 102 L 310 123" stroke="#ccc" stroke-width="1.5"/>
  <polygon points="305,121 310,131 315,121" fill="#ccc"/>

  <!-- ═══ Decision: target exists? ═══ -->
  <polygon points="310,133 392,168 310,203 228,168" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="310" y="165" font-family="monospace" font-size="9" fill="#e74c3c" text-anchor="middle">target dir</text>
  <text x="310" y="178" font-family="monospace" font-size="9" fill="#e74c3c" text-anchor="middle">exists?</text>

  <path d="M 392 168 L 468 168" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="483" y="163" font-family="monospace" font-size="9" fill="#e74c3c">no</text>
  <rect x="468" y="153" width="110" height="30" fill="#fff" stroke="#f39c12" stroke-width="1.5" rx="2"/>
  <text x="523" y="172" font-family="monospace" font-size="9" fill="#f39c12" text-anchor="middle">prompt create?</text>
  <path d="M 523 183 L 523 208 L 320 208" stroke="#ccc" stroke-width="1"/>
  <polygon points="322,203 312,208 322,213" fill="#ccc"/>

  <path d="M 310 203 L 310 226" stroke="#ccc" stroke-width="1.5"/>
  <polygon points="305,224 310,234 315,224" fill="#ccc"/>
  <text x="322" y="220" font-family="monospace" font-size="8" fill="#27ae60">yes</text>

  <!-- ═══ Decision: existing docs/? ═══ -->
  <polygon points="310,236 392,271 310,306 228,271" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="310" y="268" font-family="monospace" font-size="9" fill="#e74c3c" text-anchor="middle">existing</text>
  <text x="310" y="281" font-family="monospace" font-size="9" fill="#e74c3c" text-anchor="middle">docs/?</text>

  <path d="M 392 271 L 468 271" stroke="#f39c12" stroke-width="1.5"/>
  <text x="418" y="264" font-family="monospace" font-size="8" fill="#f39c12">yes</text>
  <rect x="468" y="256" width="110" height="30" fill="#fff" stroke="#f39c12" stroke-width="1.5" rx="2"/>
  <text x="523" y="275" font-family="monospace" font-size="9" fill="#f39c12" text-anchor="middle">backup docs/old/</text>
  <path d="M 523 286 L 523 311 L 320 311" stroke="#ccc" stroke-width="1"/>
  <polygon points="322,306 312,311 322,316" fill="#ccc"/>

  <path d="M 310 306 L 310 329" stroke="#ccc" stroke-width="1.5"/>
  <polygon points="305,327 310,337 315,327" fill="#ccc"/>
  <text x="322" y="321" font-family="monospace" font-size="8" fill="#27ae60">no</text>

  <!-- ═══ [1/4] create dirs ═══ -->
  <rect x="200" y="341" width="220" height="40" fill="#fff" stroke="#9b59b6" stroke-width="2" rx="2"/>
  <text x="310" y="358" font-family="monospace" font-size="10" fill="#9b59b6" text-anchor="middle">[1/4] create directories</text>
  <text x="310" y="373" font-family="monospace" font-size="7" fill="#999" text-anchor="middle">docs/ homes (incl. business, legal, ops) + .claude/</text>

  <path d="M 310 381 L 310 401" stroke="#ccc" stroke-width="1.5"/>
  <polygon points="305,399 310,409 315,399" fill="#ccc"/>

  <!-- ═══ [2/4] copy ═══ -->
  <rect x="200" y="411" width="220" height="40" fill="#fff" stroke="#9b59b6" stroke-width="2" rx="2"/>
  <text x="310" y="428" font-family="monospace" font-size="10" fill="#9b59b6" text-anchor="middle">[2/4] copy SK files from pkg/</text>
  <text x="310" y="443" font-family="monospace" font-size="7" fill="#999" text-anchor="middle">docs · commands · agents · skills · templates</text>

  <path d="M 310 451 L 310 471" stroke="#ccc" stroke-width="1.5"/>
  <polygon points="305,469 310,479 315,469" fill="#ccc"/>

  <!-- ═══ Decision: CLAUDE.md exists? (never overwritten) ═══ -->
  <polygon points="310,481 398,521 310,561 222,521" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="310" y="518" font-family="monospace" font-size="9" fill="#e74c3c" text-anchor="middle">CLAUDE.md</text>
  <text x="310" y="531" font-family="monospace" font-size="9" fill="#e74c3c" text-anchor="middle">exists?</text>

  <!-- yes: preserve + sidecar -->
  <path d="M 398 521 L 470 521" stroke="#f39c12" stroke-width="1.5"/>
  <text x="420" y="514" font-family="monospace" font-size="8" fill="#f39c12">yes</text>
  <rect x="470" y="499" width="150" height="44" fill="#fff" stroke="#f39c12" stroke-width="1.5" rx="2"/>
  <text x="545" y="517" font-family="monospace" font-size="8" fill="#f39c12" text-anchor="middle">keep your CLAUDE.md</text>
  <text x="545" y="531" font-family="monospace" font-size="8" fill="#f39c12" text-anchor="middle">write CLAUDE.sk.md</text>
  <path d="M 545 543 L 545 575 L 320 575" stroke="#ccc" stroke-width="1"/>
  <polygon points="322,570 312,575 322,580" fill="#ccc"/>

  <!-- no: create -->
  <path d="M 310 561 L 310 585" stroke="#ccc" stroke-width="1.5"/>
  <polygon points="305,583 310,593 315,583" fill="#ccc"/>
  <text x="322" y="577" font-family="monospace" font-size="8" fill="#27ae60">no: create CLAUDE.md</text>

  <!-- ═══ [3/4] validate ═══ -->
  <rect x="200" y="601" width="220" height="40" fill="#fff" stroke="#9b59b6" stroke-width="2" rx="2"/>
  <text x="310" y="618" font-family="monospace" font-size="10" fill="#9b59b6" text-anchor="middle">[3/4] validate install</text>
  <text x="310" y="633" font-family="monospace" font-size="7" fill="#999" text-anchor="middle">check core files exist</text>

  <path d="M 310 641 L 310 661" stroke="#ccc" stroke-width="1.5"/>
  <polygon points="305,659 310,669 315,659" fill="#ccc"/>

  <!-- ═══ [4/4] summary ═══ -->
  <rect x="200" y="671" width="220" height="40" fill="#fff" stroke="#9b59b6" stroke-width="2" rx="2"/>
  <text x="310" y="688" font-family="monospace" font-size="10" fill="#9b59b6" text-anchor="middle">[4/4] summary + next steps</text>
  <text x="310" y="703" font-family="monospace" font-size="7" fill="#999" text-anchor="middle">save .sk-source · print guide</text>

  <path d="M 310 711 L 310 733" stroke="#ccc" stroke-width="1.5"/>
  <polygon points="305,731 310,741 315,731" fill="#ccc"/>

  <!-- ═══ End ═══ -->
  <ellipse cx="310" cy="763" rx="110" ry="22" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="310" y="768" font-family="monospace" font-size="10" fill="#27ae60" text-anchor="middle">[SUCCESS] SK installed</text>

  <!-- Source resolution note -->
  <rect x="30" y="411" width="150" height="72" fill="none" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="105" y="429" font-family="monospace" font-size="8" fill="#666" text-anchor="middle" font-weight="bold">source resolution</text>
  <text x="40" y="444" font-family="monospace" font-size="7" fill="#999">1. --from flag</text>
  <text x="40" y="457" font-family="monospace" font-size="7" fill="#999">2. .sk-source saved path</text>
  <text x="40" y="470" font-family="monospace" font-size="7" fill="#999">3. __dirname (npm pkg)</text>

  <!-- CLAUDE.md note -->
  <rect x="30" y="500" width="150" height="58" fill="none" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="105" y="518" font-family="monospace" font-size="8" fill="#666" text-anchor="middle" font-weight="bold">CLAUDE.md is yours</text>
  <text x="40" y="533" font-family="monospace" font-size="7" fill="#999">never overwritten;</text>
  <text x="40" y="546" font-family="monospace" font-size="7" fill="#999">template -&gt; CLAUDE.sk.md</text>

  <!-- Bottom note -->
  <text x="320" y="828" font-family="monospace" font-size="9" fill="#999" text-anchor="middle">install backs up existing docs · CLAUDE.md never overwritten · remove keeps docs/ &amp; your CLAUDE.md</text>
  <text x="320" y="846" font-family="monospace" font-size="8" fill="#ccc" text-anchor="middle">npx shipkit-cld [install | update | remove] [target]</text>
</svg>
