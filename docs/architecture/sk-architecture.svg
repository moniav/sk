<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e5e5" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ccc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" fill="#fafafa"/>
  <rect width="860" height="480" fill="url(#grid)"/>

  <!-- Title -->
  <text x="40" y="35" font-family="monospace" font-size="14" fill="#333" font-weight="bold">SK (shipkit-cld)</text>
  <text x="200" y="35" font-family="monospace" font-size="12" fill="#888">[ ARCHITECTURE ]</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- CLI Node -->
  <!-- ═══════════════════════════════════════════ -->
  <circle cx="80" cy="200" r="35" fill="none" stroke="#ccc" stroke-width="2"/>
  <circle cx="80" cy="200" r="18" fill="#3498db"/>
  <text x="80" y="205" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">CLI</text>
  <rect x="40" y="250" width="80" height="24" fill="none" stroke="#ccc" stroke-width="1"/>
  <text x="80" y="266" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">cli.mjs</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- pkg/ Container -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="190" y="70" width="280" height="340" fill="none" stroke="#ccc" stroke-width="2" rx="4"/>
  <text x="330" y="60" font-family="monospace" font-size="11" fill="#666" text-anchor="middle" font-weight="bold">pkg/</text>
  <text x="330" y="95" font-family="monospace" font-size="8" fill="#999" text-anchor="middle">self-contained payload</text>

  <!-- CLAUDE.md -->
  <rect x="210" y="110" width="240" height="32" fill="#fff" stroke="#27ae60" stroke-width="1.5" rx="2"/>
  <text x="330" y="131" font-family="monospace" font-size="10" fill="#27ae60" text-anchor="middle">CLAUDE.md</text>

  <!-- Commands -->
  <rect x="210" y="152" width="240" height="42" fill="#fff" stroke="#3498db" stroke-width="1.5" rx="2"/>
  <text x="330" y="170" font-family="monospace" font-size="10" fill="#3498db" text-anchor="middle">.claude/commands/sk/</text>
  <text x="330" y="184" font-family="monospace" font-size="8" fill="#999" text-anchor="middle">29 slash commands</text>

  <!-- Agents -->
  <rect x="210" y="204" width="240" height="42" fill="#fff" stroke="#9b59b6" stroke-width="1.5" rx="2"/>
  <text x="330" y="222" font-family="monospace" font-size="10" fill="#9b59b6" text-anchor="middle">.claude/agents/</text>
  <text x="330" y="236" font-family="monospace" font-size="8" fill="#999" text-anchor="middle">implementer, spec-reviewer, quality-reviewer</text>

  <!-- Skills -->
  <rect x="210" y="256" width="240" height="42" fill="#fff" stroke="#f39c12" stroke-width="1.5" rx="2"/>
  <text x="330" y="274" font-family="monospace" font-size="10" fill="#f39c12" text-anchor="middle">.claude/skills/</text>
  <text x="330" y="288" font-family="monospace" font-size="8" fill="#999" text-anchor="middle">TDD, escalation, legal, verification +2</text>

  <!-- Docs -->
  <rect x="210" y="308" width="240" height="42" fill="#fff" stroke="#666" stroke-width="1.5" rx="2"/>
  <text x="330" y="326" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">docs/</text>
  <text x="330" y="340" font-family="monospace" font-size="8" fill="#999" text-anchor="middle">templates, conventions, SOPs</text>

  <!-- Arrow: CLI reads pkg/ -->
  <path d="M 115 200 L 180 200" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="148" y="192" font-family="monospace" font-size="8" fill="#3498db" text-anchor="middle">reads</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Target Project Container -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="560" y="70" width="270" height="340" fill="none" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="695" y="60" font-family="monospace" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="bold">TARGET PROJECT</text>
  <text x="695" y="95" font-family="monospace" font-size="8" fill="#999" text-anchor="middle">user's project directory</text>

  <!-- Installed CLAUDE.md -->
  <rect x="580" y="110" width="230" height="32" fill="#fff" stroke="#27ae60" stroke-width="1.5" rx="2"/>
  <text x="695" y="131" font-family="monospace" font-size="10" fill="#27ae60" text-anchor="middle">CLAUDE.md</text>

  <!-- Installed Commands -->
  <rect x="580" y="152" width="230" height="32" fill="#fff" stroke="#3498db" stroke-width="1.5" rx="2"/>
  <text x="695" y="173" font-family="monospace" font-size="10" fill="#3498db" text-anchor="middle">.claude/commands/sk/</text>

  <!-- Installed Agents -->
  <rect x="580" y="194" width="230" height="32" fill="#fff" stroke="#9b59b6" stroke-width="1.5" rx="2"/>
  <text x="695" y="215" font-family="monospace" font-size="10" fill="#9b59b6" text-anchor="middle">.claude/agents/</text>

  <!-- Installed Skills -->
  <rect x="580" y="236" width="230" height="32" fill="#fff" stroke="#f39c12" stroke-width="1.5" rx="2"/>
  <text x="695" y="257" font-family="monospace" font-size="10" fill="#f39c12" text-anchor="middle">.claude/skills/</text>

  <!-- Installed Docs -->
  <rect x="580" y="278" width="230" height="32" fill="#fff" stroke="#666" stroke-width="1.5" rx="2"/>
  <text x="695" y="299" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">docs/</text>

  <!-- User content (dashed - preserved on update) -->
  <rect x="580" y="325" width="230" height="70" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3" rx="2"/>
  <text x="695" y="350" font-family="monospace" font-size="9" fill="#27ae60" text-anchor="middle">user-authored content</text>
  <text x="695" y="365" font-family="monospace" font-size="8" fill="#999" text-anchor="middle">tasks, conventions, system,</text>
  <text x="695" y="378" font-family="monospace" font-size="8" fill="#999" text-anchor="middle">architecture, decisions</text>

  <!-- Arrow: CLI copies to target -->
  <path d="M 470 200 L 550 200" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="510" y="192" font-family="monospace" font-size="8" fill="#27ae60" text-anchor="middle">copies</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- CLI Commands Legend -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="20" y="310" width="155" height="95" fill="none" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="97" y="330" font-family="monospace" font-size="9" fill="#666" text-anchor="middle" font-weight="bold">CLI Commands</text>
  <text x="32" y="350" font-family="monospace" font-size="8" fill="#3498db">install</text>
  <text x="80" y="350" font-family="monospace" font-size="8" fill="#999">fresh setup</text>
  <text x="32" y="366" font-family="monospace" font-size="8" fill="#27ae60">update</text>
  <text x="80" y="366" font-family="monospace" font-size="8" fill="#999">cmds + templates</text>
  <text x="32" y="382" font-family="monospace" font-size="8" fill="#e74c3c">remove</text>
  <text x="80" y="382" font-family="monospace" font-size="8" fill="#999">keeps docs/</text>
  <text x="32" y="398" font-family="monospace" font-size="8" fill="#f39c12">--from</text>
  <text x="80" y="398" font-family="monospace" font-size="8" fill="#999">local source</text>

  <!-- Bottom note -->
  <text x="430" y="450" font-family="monospace" font-size="10" fill="#999" text-anchor="middle">zero dependencies · Node.js &gt;= 18 · npm: shipkit-cld v1.4.1</text>
  <text x="430" y="468" font-family="monospace" font-size="8" fill="#ccc" text-anchor="middle">update overwrites commands/templates · preserves user-authored content</text>
</svg>
