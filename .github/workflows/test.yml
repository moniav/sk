name: test

on:
  push:
    # Branches only. A release tag points at the commit before its own baselines
    # are generated (they are read from the tag), so the baselines check cannot
    # pass on the tagged commit. The branch run of the next commit covers it.
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          # The release-baselines check compares against every tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies: nothing to install. The claude CLI is not present here,
      # so scripts/check.mjs skips plugin validation and runs everything else.
      - run: npm test
